<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 B 站音频播客</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #33224a, #0a0d1a 55%); color: #f7f7fb; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 64px 24px; }
.hero { display: flex; gap: 28px; align-items: center; margin-bottom: 36px; }
.hero img { width: 150px; height: 150px; border-radius: 24px; box-shadow: 0 18px 60px rgba(0,0,0,.45); }
h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.02em; }
p { margin: 0; color: #b6bdd2; }
.feed { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
a.button { display: inline-block; padding: 10px 16px; border-radius: 999px; background: #fb7299; color: #160b13; font-weight: 700; text-decoration: none; }
a.ghost { background: rgba(255,255,255,.1); color: #fff; }
ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid rgba(255,255,255,.1); }
li { display: flex; justify-content: space-between; gap: 22px; padding: 16px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
li a { color: #f7f7fb; text-decoration: none; }
li a:hover { color: #fb7299; }
li span { color: #8992ae; flex: none; }
footer { margin-top: 42px; color: #6f7893; font-size: 13px; }
@media (max-width: 600px) { .hero { flex-direction: column; align-items: flex-start; } main { padding-top: 36px; } }
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="cover.png" alt="封面">
    <div>
      <h1>我的 B 站音频播客</h1>
      <p>由 Bili2Podcast 生成的个人播客订阅。</p>
      <div class="feed">
        <a class="button" href="feed.xml">RSS 订阅地址</a>
        <a class="button ghost" href=""https://csyuer.github.io/bili2podcast/feed.xml"">在浏览器打开 RSS</a>
      </div>
    </div>
  </div>
  <ul><li>还没有已发布的单集</li></ul>
  <footer>由 Bili2Podcast 生成 · 音频来自 B 站，请仅用于个人合法备份</footer>
</main>
</body>
</html>
